# Hexo 配置
## 文档: https://hexo.io/zh-cn/docs/configuration.html

# 站点配置
title: lzzlli 的学习笔记
subtitle: 游戏开发技术沉淀
description: 个人游戏开发学习笔记博客
keywords: 游戏开发, TypeScript, UE, puerTS, 红点系统
author: lzzlli
language: zh-CN
timezone: Asia/Shanghai

# URL 配置
url: https://dolly1221.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
# Typography 主题使用 prism_plugin 做代码高亮，需关闭默认 highlight
syntax_highlighter:
include:
exclude:
ignore:

# marked 渲染器：文章内相对图片路径指向文章资源文件夹
marked:
  prependRoot: true
  postAsset: true

# 首页分页
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类 & 标签
default_category: uncategorized
category_map:
tag_map:

# 元数据
meta_generator: true

# 日期/时间格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# 分页
per_page: 10
pagination_dir: page

# ============ Typography 主题相关配置 ============
theme: typography

# 代码高亮：关闭默认 highlight，使用 prism_plugin
highlight:
  enable: false

# 插件
plugin:
  - hexo-generator-category-enhance
  - hexo-generator-feed
  - hexo-asset-image
  - hexo-prism-plugin
  - hexo-toc

# 归档页生成
archive_generator:
  per_page: 0

# 分类索引页 + 各分类页生成
category_generator:
  per_page: 10
  enable_index_page: true

# 标签索引页 + 各标签页生成
tag_generator:
  per_page: 10
  enable_index_page: true

# Atom Feed 生成
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '

# Prism 代码高亮
prism_plugin:
  mode: 'preprocess'
  theme: 'default'
  line_number: true

# 部署（使用 GitHub Actions，此处留空）
deploy:
  type: ''
